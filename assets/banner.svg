<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" fill="none" role="img" aria-label="Memovoff — C++ / Python developer. Telegram bots, automation, backend.">
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" stroke="#F2F0EB" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <pattern id="noise" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="2" r="0.5" fill="#F2F0EB" opacity="0.07"/>
      <circle cx="7" cy="8" r="0.4" fill="#F2F0EB" opacity="0.05"/>
      <circle cx="9" cy="1" r="0.35" fill="#FF2B2B" opacity="0.12"/>
    </pattern>
    <radialGradient id="redGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1030 180) rotate(90) scale(430 300)">
      <stop stop-color="#FF2B2B" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FF2B2B" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="#080808"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#redGlow)"/>
  <rect width="1280" height="360" fill="url(#noise)"/>

  <!-- right composition -->
  <g>
    <circle cx="1030" cy="180" r="154" stroke="#F2F0EB" stroke-opacity="0.08"/>
    <circle cx="1030" cy="180" r="116" stroke="#FF2B2B" stroke-opacity="0.22"/>
    <circle cx="1030" cy="180" r="76" stroke="#F2F0EB" stroke-opacity="0.12"/>
    <path d="M1030 16V344" stroke="#F2F0EB" stroke-opacity="0.08"/>
    <path d="M866 180H1194" stroke="#FF2B2B" stroke-opacity="0.16"/>
    <rect x="1025" y="175" width="10" height="10" fill="#FF2B2B"/>
    <g stroke="#FF2B2B" stroke-opacity="0.42">
      <path d="M880 100V88M874 94H886"/>
      <path d="M1180 260V248M1174 254H1186"/>
    </g>
    <g font-family="Consolas, 'Courier New', monospace" font-size="9" letter-spacing="2" fill="#F2F0EB" opacity="0.3">
      <text x="1186" y="120" text-anchor="end">SYS.ONLINE</text>
    </g>
  </g>

  <!-- top line -->
  <rect x="80" y="44" width="8" height="8" fill="#FF2B2B"/>
  <text x="100" y="53" fill="#F2F0EB" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2.5">MEMOVOFF / PROFILE</text>
  <circle cx="1060" cy="48" r="3.5" fill="#FF2B2B"/>
  <circle cx="1060" cy="48" r="7" fill="#FF2B2B" opacity="0.18" filter="url(#softGlow)"/>
  <text x="1200" y="53" fill="#F2F0EB" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="1.8" text-anchor="end">ONLINE // UTC+3</text>
  <path d="M80 74H1200" stroke="#F2F0EB" stroke-opacity="0.14"/>

  <!-- main -->
  <text x="80" y="130" fill="#FF2B2B" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700" letter-spacing="5">C++ / PYTHON DEVELOPER</text>

  <!-- restrained offset print effect -->
  <text x="86" y="238" fill="#FF2B2B" opacity="0.5" font-family="'Arial Black', Impact, 'Segoe UI', sans-serif" font-weight="900" font-size="108" letter-spacing="3">MEMOVOFF</text>
  <text x="80" y="232" fill="#F2F0EB" font-family="'Arial Black', Impact, 'Segoe UI', sans-serif" font-weight="900" font-size="108" letter-spacing="3">MEMOVOFF</text>

  <rect x="80" y="254" width="112" height="2" fill="#FF2B2B"/>
  <text x="80" y="286" fill="#A3A3A3" font-family="Consolas, 'Courier New', monospace" font-size="16" letter-spacing="2.5">TELEGRAM BOTS · AUTOMATION · BACKEND</text>

  <!-- bottom line -->
  <path d="M80 312H1200" stroke="#F2F0EB" stroke-opacity="0.14"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="10" letter-spacing="2" fill="#6B6B6B">
    <text x="80" y="336">BOTS / AUTOMATION / BACKEND</text>
    <text x="1200" y="336" text-anchor="end">TELEGRAM @MEMOVOFF</text>
  </g>
</svg>
