<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-label="Что делаю: Telegram-боты, автоматизация, бэкенд">
  <defs>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#F2F0EB" opacity="0.06"/>
    </pattern>
  </defs>

  <rect x="10" y="10" width="1180" height="280" fill="#FF2B2B" opacity="0.12"/>
  <rect x="1" y="1" width="1180" height="280" fill="#080808" stroke="#F2F0EB" stroke-opacity="0.24" stroke-width="1.5"/>
  <rect x="3" y="3" width="1176" height="276" fill="url(#dots)"/>

  <g font-family="Consolas, 'Courier New', monospace">
    <text x="48" y="44" fill="#FF2B2B" font-size="12" letter-spacing="2.5" font-weight="700">[ ЧТО ДЕЛАЮ ]</text>
    <text x="1152" y="44" fill="#6B6B6B" font-size="11" letter-spacing="2" text-anchor="end">01 — 03</text>
    <path d="M48 62H1152" stroke="#F2F0EB" stroke-opacity="0.14"/>
  </g>

  <g stroke="#F2F0EB" stroke-opacity="0.12" stroke-dasharray="4 6">
    <path d="M408 78V262"/>
    <path d="M792 78V262"/>
  </g>

  <!-- 01 BOTS -->
  <g>
    <text x="48" y="102" fill="#FF2B2B" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2" font-weight="700">01</text>
    <g stroke="#F2F0EB" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="332" y="88" width="26" height="20" rx="4"/>
      <path d="M345 88V80"/>
      <circle cx="345" cy="77" r="2" fill="#FF2B2B" stroke="none"/>
      <circle cx="339" cy="98" r="1.8" fill="#FF2B2B" stroke="none"/>
      <circle cx="351" cy="98" r="1.8" fill="#FF2B2B" stroke="none"/>
      <path d="M339 108L334 114V108"/>
    </g>
    <text x="48" y="150" fill="#F2F0EB" font-family="'Arial Black', Impact, 'Segoe UI', sans-serif" font-weight="900" font-size="34" letter-spacing="1">BOTS</text>
    <rect x="48" y="164" width="34" height="2" fill="#FF2B2B"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#9A9A9A">
      <text x="48" y="194">Telegram-боты, сценарии</text>
      <text x="48" y="220">и интеграции.</text>
    </g>
    <g font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#FF2B2B">
      <rect x="48" y="242" width="98" height="26" fill="none" stroke="#FF2B2B" stroke-opacity="0.35"/>
      <text x="60" y="259" letter-spacing="1">TELEGRAM</text>
      <rect x="156" y="242" width="82" height="26" fill="none" stroke="#FF2B2B" stroke-opacity="0.35"/>
      <text x="168" y="259" letter-spacing="1">PYTHON</text>
    </g>
  </g>

  <!-- 02 AUTOMATION -->
  <g>
    <text x="432" y="102" fill="#FF2B2B" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2" font-weight="700">02</text>
    <g stroke="#F2F0EB" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M730 92A12 12 0 1 1 720 98"/>
      <path d="M730 80V92H718"/>
      <path d="M736 106A12 12 0 1 1 746 100"/>
      <path d="M736 118V106H748"/>
    </g>
    <text x="432" y="150" fill="#F2F0EB" font-family="'Arial Black', Impact, 'Segoe UI', sans-serif" font-weight="900" font-size="30" letter-spacing="1">AUTOMATION</text>
    <rect x="432" y="164" width="34" height="2" fill="#FF2B2B"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#9A9A9A">
      <text x="432" y="194">Парсеры, скрипты и рутина,</text>
      <text x="432" y="220">которую делает код.</text>
    </g>
    <g font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#FF2B2B">
      <rect x="432" y="242" width="84" height="26" fill="none" stroke="#FF2B2B" stroke-opacity="0.35"/>
      <text x="444" y="259" letter-spacing="1">PARSING</text>
      <rect x="528" y="242" width="84" height="26" fill="none" stroke="#FF2B2B" stroke-opacity="0.35"/>
      <text x="540" y="259" letter-spacing="1">SCRIPTS</text>
    </g>
  </g>

  <!-- 03 BACKEND -->
  <g>
    <text x="816" y="102" fill="#FF2B2B" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2" font-weight="700">03</text>
    <g stroke="#F2F0EB" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1098" y="82" width="30" height="9" rx="2"/>
      <rect x="1098" y="96" width="30" height="9" rx="2"/>
      <rect x="1098" y="110" width="30" height="9" rx="2"/>
      <circle cx="1104" cy="86.5" r="1.5" fill="#FF2B2B" stroke="none"/>
      <circle cx="1104" cy="100.5" r="1.5" fill="#FF2B2B" stroke="none"/>
      <circle cx="1104" cy="114.5" r="1.5" fill="#FF2B2B" stroke="none"/>
    </g>
    <text x="816" y="150" fill="#F2F0EB" font-family="'Arial Black', Impact, 'Segoe UI', sans-serif" font-weight="900" font-size="34" letter-spacing="1">BACKEND</text>
    <rect x="816" y="164" width="34" height="2" fill="#FF2B2B"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#9A9A9A">
      <text x="816" y="194">API, базы данных</text>
      <text x="816" y="220">и сервисы.</text>
    </g>
    <g font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#FF2B2B">
      <rect x="816" y="242" width="52" height="26" fill="none" stroke="#FF2B2B" stroke-opacity="0.35"/>
      <text x="828" y="259" letter-spacing="1">API</text>
      <rect x="880" y="242" width="102" height="26" fill="none" stroke="#FF2B2B" stroke-opacity="0.35"/>
      <text x="892" y="259" letter-spacing="1">DATABASES</text>
    </g>
  </g>
</svg>
