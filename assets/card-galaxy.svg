<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-label="galaxy-nbody — interactive GPU N-body simulation of two colliding spiral galaxies">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/>
      <stop offset="0.55" stop-color="#0B1324"/>
      <stop offset="1" stop-color="#0A1020"/>
    </linearGradient>
    <radialGradient id="cardGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 150) rotate(90) scale(260 190)">
      <stop stop-color="#7C3AED" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleFill" x1="56" y1="110" x2="430" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#E9E4FF"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="56" y1="0" x2="196" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="galaxyArm" x1="-90" y1="0" x2="95" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="galaxyArm2" x1="-60" y1="0" x2="70" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06B6D4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="coreViolet">
      <stop stop-color="#F5F3FF"/>
      <stop offset="0.4" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreCyan">
      <stop stop-color="#ECFEFF"/>
      <stop offset="0.4" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurL" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blurM" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="cardStars" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="24" r="0.9" fill="#E2E8F0" opacity="0.35"/>
      <circle cx="72" cy="12" r="0.6" fill="#C4B5FD" opacity="0.4"/>
      <circle cx="104" cy="58" r="0.8" fill="#67E8F9" opacity="0.3"/>
      <circle cx="42" cy="82" r="0.6" fill="#E2E8F0" opacity="0.25"/>
      <circle cx="88" cy="106" r="0.7" fill="#A5B4FC" opacity="0.3"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="28" fill="url(#cardBg)" stroke="#22304A" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="298" rx="28" fill="url(#cardGlow)"/>
  <rect x="1" y="1" width="1198" height="298" rx="28" fill="url(#cardStars)"/>
  <path d="M56 1H196" stroke="url(#accentLine)" stroke-width="2"/>

  <text x="56" y="62" fill="#67E8F9" font-family="'Fira Code', Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2.6">01 / FEATURED PROJECT</text>
  <text x="1144" y="62" text-anchor="end" fill="#67E8F9" font-family="'Fira Code', Consolas, 'Courier New', monospace" font-size="13" letter-spacing="2">VIEW REPO →</text>

  <text x="56" y="128" fill="url(#titleFill)" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="45" font-weight="700">galaxy-nbody</text>
  <text x="56" y="160" fill="#A78BFA" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18">Interactive GPU N-body simulation</text>

  <text x="56" y="196" fill="#94A3B8" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17">Две спиральные галактики сталкиваются в реальном времени —</text>
  <text x="56" y="221" fill="#94A3B8" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17">физика на GPU, Python + Taichi.</text>

  <g font-family="'Fira Code', Consolas, 'Courier New', monospace" font-size="13">
    <rect x="56" y="244" width="92" height="28" rx="14" fill="#101A2E" stroke="#263650"/>
    <text x="102" y="262" text-anchor="middle" fill="#C7D2FE">Python</text>
    <rect x="156" y="244" width="84" height="28" rx="14" fill="#101A2E" stroke="#263650"/>
    <text x="198" y="262" text-anchor="middle" fill="#C7D2FE">Taichi</text>
    <rect x="248" y="244" width="120" height="28" rx="14" fill="#101A2E" stroke="#263650"/>
    <text x="308" y="262" text-anchor="middle" fill="#C7D2FE">MIT License</text>
  </g>

  <!-- illustration -->
  <g stroke="#263650" stroke-width="1">
    <circle cx="990" cy="150" r="104" stroke-dasharray="2 9" opacity="0.75"/>
    <path d="M990 36V46M990 254V264M876 150H886M1094 150H1104" stroke-linecap="round" opacity="0.7"/>
  </g>
  <g fill="#475569" font-family="'Fira Code', Consolas, monospace" font-size="9">
    <text x="997" y="48" opacity="0.65">α</text>
    <text x="1108" y="154" opacity="0.65">δ</text>
  </g>

  <g transform="translate(962 162) rotate(-16)">
    <ellipse rx="125" ry="54" fill="#7C3AED" opacity="0.14" filter="url(#blurL)"/>
    <ellipse rx="92" ry="24" fill="#6D28D9" opacity="0.16" filter="url(#blurM)"/>
    <ellipse rx="94" ry="23" stroke="url(#galaxyArm)" stroke-width="1.2" opacity="0.8"/>
    <ellipse rx="70" ry="16" stroke="#A78BFA" stroke-width="0.9" opacity="0.55"/>
    <ellipse rx="46" ry="9" stroke="#DDD6FE" stroke-width="0.7" opacity="0.4"/>
    <path d="M-88 -2C-58 -24 -6 -31 34 -14C60 -2 76 8 88 20" stroke="url(#galaxyArm)" stroke-width="1.4" stroke-linecap="round" opacity="0.65"/>
    <path d="M-82 12C-48 28 12 28 52 12" stroke="#A78BFA" stroke-width="0.9" stroke-linecap="round" opacity="0.35"/>
    <circle r="22" fill="url(#coreViolet)" opacity="0.75"/>
    <circle r="7" fill="#C4B5FD" opacity="0.45" filter="url(#blurM)"/>
    <circle r="3.4" fill="#F5F3FF"/>
    <g fill="#DDD6FE">
      <circle cx="-78" cy="-6" r="1.1" opacity="0.7"/>
      <circle cx="-48" cy="-19" r="0.8" opacity="0.45"/>
      <circle cx="-8" cy="-23" r="1" opacity="0.55"/>
      <circle cx="34" cy="-16" r="0.7" opacity="0.4"/>
      <circle cx="66" cy="-2" r="0.9" opacity="0.5"/>
      <circle cx="84" cy="18" r="0.7" opacity="0.4"/>
      <circle cx="34" cy="17" r="0.8" opacity="0.35"/>
      <circle cx="-24" cy="18" r="0.6" opacity="0.35"/>
    </g>
  </g>

  <g transform="translate(1048 102) rotate(28) scale(0.58)">
    <ellipse rx="110" ry="42" fill="#0891B2" opacity="0.14" filter="url(#blurL)"/>
    <ellipse rx="86" ry="22" stroke="url(#galaxyArm2)" stroke-width="1.3" opacity="0.75"/>
    <ellipse rx="60" ry="14" stroke="#67E8F9" stroke-width="0.9" opacity="0.45"/>
    <circle r="18" fill="url(#coreCyan)" opacity="0.75"/>
    <circle r="3" fill="#ECFEFF"/>
    <g fill="#A5F3FC">
      <circle cx="-72" cy="-4" r="1.2" opacity="0.6"/>
      <circle cx="-34" cy="-16" r="0.8" opacity="0.45"/>
      <circle cx="16" cy="-15" r="1" opacity="0.5"/>
      <circle cx="58" cy="-3" r="0.8" opacity="0.4"/>
      <circle cx="80" cy="12" r="1" opacity="0.45"/>
    </g>
  </g>

  <path d="M1030 196C1060 190 1084 174 1100 156" stroke="#67E8F9" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="2 6"/>
  <g fill="#A5F3FC">
    <circle cx="1042" cy="195" r="1.2" opacity="0.6"/>
    <circle cx="1066" cy="185" r="0.9" opacity="0.5"/>
    <circle cx="1086" cy="170" r="1.1" opacity="0.45"/>
  </g>
</svg>
