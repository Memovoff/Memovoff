    <text x="36" y="290">
      <tspan fill="#67E8F9">memovoff@github</tspan><tspan fill="#475569">:~$ </tspan><tspan fill="#E2E8F0">status</tspan>
    </text>
    <text x="36" y="320">
      <tspan fill="#22D3EE">●</tspan><tspan fill="#C7D2FE"> open to interesting projects</tspan>
