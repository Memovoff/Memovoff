<svg xmlns="http://www.w3.org/2000/svg" width="520" height="390" viewBox="0 0 520 390" fill="none" role="img" aria-label="Terminal card: Memovoff, C++ / Python developer">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="520" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1120"/>
      <stop offset="1" stop-color="#080D19"/>
    </linearGradient>
    <radialGradient id="termGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(470 34) rotate(130) scale(230 180)">
      <stop stop-color="#7C3AED" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="termGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#334155" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>
    <linearGradient id="termRule" x1="22" y1="0" x2="498" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A78BFA" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="cursorGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="518" height="388" rx="22" fill="url(#termBg)" stroke="#22304A" stroke-width="1.5"/>
