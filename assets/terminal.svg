<svg xmlns="http://www.w3.org/2000/svg" width="520" height="390" viewBox="0 0 520 390" fill="none" role="img" aria-label="Terminal: Memovoff — C++ / Python, bots, automation, backend, online">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#F2F0EB" opacity="0.02"/>
    </pattern>
    <filter id="dotGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect x="9" y="9" width="510" height="380" fill="#FF2B2B" opacity="0.16"/>
  <rect x="1" y="1" width="510" height="380" fill="#080808" stroke="#F2F0EB" stroke-opacity="0.28" stroke-width="1.5"/>
  <rect x="3" y="3" width="506" height="376" fill="url(#scan)"/>

  <g font-family="Consolas, 'Courier New', monospace">
    <rect x="3" y="3" width="506" height="45" fill="#0A0A0A"/>
    <path d="M3 48H509" stroke="#F2F0EB" stroke-opacity="0.16"/>
    <rect x="20" y="19" width="6" height="6" fill="#FF2B2B"/>
    <text x="38" y="31" fill="#F2F0EB" font-size="12" letter-spacing="2" font-weight="700">MEMOVOFF / TERMINAL</text>
    <circle cx="442" cy="27" r="3" fill="#FF2B2B"/>
    <text x="492" y="31" fill="#8C8C8C" font-size="10" letter-spacing="1.5" text-anchor="end">ONLINE</text>

    <text x="36" y="90" fill="#FF2B2B" font-size="18" font-weight="700">memovoff@dev:~$</text>
    <text x="216" y="90" fill="#F2F0EB" font-size="18">whoami</text>
    <text x="36" y="118" fill="#F2F0EB" font-size="18" font-weight="700">Memovoff</text>

    <text x="36" y="154" fill="#FF2B2B" font-size="18" font-weight="700">memovoff@dev:~$</text>
    <text x="216" y="154" fill="#F2F0EB" font-size="18">stack</text>
    <text x="36" y="182" fill="#A3A3A3" font-size="18">C++ / Python / Git / Telegram</text>

    <text x="36" y="218" fill="#FF2B2B" font-size="18" font-weight="700">memovoff@dev:~$</text>
    <text x="216" y="218" fill="#F2F0EB" font-size="18">focus</text>
    <text x="36" y="246" fill="#A3A3A3" font-size="18">bots / automation / backend</text>

    <text x="36" y="282" fill="#FF2B2B" font-size="18" font-weight="700">memovoff@dev:~$</text>
    <text x="216" y="282" fill="#F2F0EB" font-size="18">status</text>
    <circle cx="43" cy="305" r="5" fill="#FF2B2B"/>
    <circle cx="43" cy="305" r="11" fill="#FF2B2B" opacity="0.22" filter="url(#dotGlow)"/>
    <text x="58" y="310" fill="#F2F0EB" font-size="18" font-weight="700">ONLINE</text>

    <text x="36" y="356" fill="#FF2B2B" font-size="18" font-weight="700">memovoff@dev:~$</text>
    <rect x="216" y="340" width="10" height="19" fill="#FF2B2B"/>
    <text x="492" y="368" fill="#6B6B6B" font-size="9" letter-spacing="1.5" text-anchor="end">SYS.OK</text>
